# Minimal SandboxAgent for kagent 0.10.x + substrate 0.0.9.
# spec.platform was removed in 0.10.0 (strict decoding rejects it); spec.substrate alone
# places the agent on substrate. Validated against the live CRD 2026-09-09.
apiVersion: kagent.dev/v1alpha2
kind: SandboxAgent
metadata:
  name: hello-substrate
  namespace: kagent
spec:
  type: Declarative
  description: Tiny declarative agent running inside a substrate actor
  declarative:
    runtime: go
    modelConfig: default-model-config
    systemMessage: |
      You are a friendly assistant living inside an Agent Substrate sandbox.
      When asked who you are, say "I am hello-substrate, a Go ADK declarative
      agent running inside a gVisor actor."
  substrate:
    workerPoolRef:
      name: kagent-default
